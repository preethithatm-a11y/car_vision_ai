<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <!-- Outer Hexagon / Shield Frame -->
  <polygon points="50,6 88,26 88,74 50,94 12,74 12,26" stroke="url(#cyberGrad)" stroke-width="4" fill="#0b1329" fill-opacity="0.85" filter="url(#glow)"/>
  
  <!-- Automotive Sleek Silhouette -->
  <path d="M28 58 L33 46 C35 41 39 37 45 37 L55 37 C61 37 65 41 67 46 L72 58 C74 59 75 62 75 65 C75 67 73 68 71 68 L68 68 C68 65 65 62 62 62 C59 62 56 65 56 68 L44 68 C44 65 41 62 38 62 C35 62 32 65 32 68 L29 68 C27 68 25 67 25 65 C25 62 26 59 28 58 Z" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Windshield -->
  <path d="M37 47 L41 40 L59 40 L63 47 Z" fill="rgba(34, 211, 238, 0.3)" stroke="#22d3ee" stroke-width="2"/>
  
