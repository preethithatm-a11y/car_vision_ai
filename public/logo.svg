  <line x1="50" y1="14" x2="50" y2="24" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="76" x2="50" y2="86" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="50" x2="28" y2="50" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="50" x2="82" y2="50" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
  
